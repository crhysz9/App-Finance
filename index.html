<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/financec.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>FINANCE</title>
</head>

<body>
    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <div class="d-flex align-items-center">
                    <a class="navbar-brand" href="index.html">
                        <img src="assets/financec.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top"> FINANCE
                    </a>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bank" viewBox="0 0 16 16">
                        <path d="m8 0 6.61 3h.89a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5H15v7a.5.5 0 0 1 .485.38l.5 2a.498.498 0 0 1-.485.62H.5a.498.498 0 0 1-.485-.62l.5-2A.5.5 0 0 1 1 13V6H.5a.5.5 0 0 1-.5-.5v-2A.5.5 0 0 1 .5 3h.89zM3.777 3h8.447L8 1zM2 6v7h1V6zm2 0v7h2.5V6zm3.5 0v7h1V6zm2 0v7H12V6zM13 6v7h1V6zm2-1V4H1v1zm-.39 9H1.39l-.25 1h13.72z" />
                    </svg>
                    <ul class="navbar-nav d-flex flex-row gap-3 ms-5 ">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Dashboard</a>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-activity" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M6 2a.5.5 0 0 1 .47.33L10 12.036l1.53-4.208A.5.5 0 0 1 12 7.5h3.5a.5.5 0 0 1 0 1h-3.15l-1.88 5.17a.5.5 0 0 1-.94 0L6 3.964 4.47 8.171A.5.5 0 0 1 4 8.5H.5a.5.5 0 0 1 0-1h3.15l1.88-5.17A.5.5 0 0 1 6 2" />
                            </svg>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Despesas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Lucros</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <div>
        <h1 class="text-center p-2">Seja bem vindo ao FINANCE</h1>
    </div>

    <div class="text-center p-2"> <!--MODAL PARA RENDA-->
        <div class="modal fade" id="exampleModalToggle" aria-hidden="true" aria-labelledby="exampleModalToggleLabel" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalToggleLabel">Adicione seu Nome e Salario</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <label for="nome"> Digite seu Nome:
                            <input id="nome" type="text" class="form-control" placeholder="Ex: João, Eduardo...">
                        </label>
                        <label for="salario"> Digite seu Salario:
                            <input id="salario" type="text" class="form-control" placeholder="Ex: R$1600, R$1500...">
                        </label>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="salvarRenda()"> Salvar </button>
                        <button class="btn btn-success" data-bs-target="#exampleModalToggle2" data-bs-toggle="modal">Adicionar Renda Extra</button>
                    </div>
                </div>
            </div>
            </div>
                <div class="modal fade" id="exampleModalToggle2" aria-hidden="true" aria-labelledby="exampleModalToggleLabel2" tabindex="-1">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="exampleModalToggleLabel2">Adicione sua Renda Extra</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form>
                                    <div class="mb-3">
                                        <label for="descricaoRendaExtra"><Table>Descrição da Renda Extra:</Table></label>
                                        <input type="text" class="form-control" id="descricaoRendaExtra" aria-describedby="emailHelp" placeholder="Ex: Freelancer, Salario 2...">
                                    </div>
                                    <div class="mb-3">
                                        <label for="valorRendaExtra" class="form-label">Quanto você recebe:</label>
                                        <input type="number" class="form-control" id="valorRendaExtra" placeholder="R$1500, R$150...">
                                    </div>
                                </form>
                            </div>
                            <div id="resultadoRendaExtra"></div>
                            <div class="modal-footer">
                                <button class="btn btn-danger" data-bs-target="#exampleModalToggle" data-bs-toggle="modal">Voltar</button>
                                <button class="btn btn-success" data-bs-dismiss="modal" onclick="salvarRendaExtra()">Salvar</button>
                            </div>
                        </div>
                    </div>
                </div>
            <button class="btn btn-primary" data-bs-target="#exampleModalToggle" data-bs-toggle="modal">Adicinar Renda</button>
        </div>
    </div> <!--FIM DO MODAL PARA RENDA-->

    <div class="text-center"> <!--MODAL PARA ADICIONAR DESPESAS-->
      <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalDespesa">
          Adicionar despesas
      </button>

      <div class="modal fade" id="modalDespesa" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
          <div class="modal-dialog">
              <div class="modal-content">
                  <div class="modal-header">
                      <h1 class="modal-title fs-5" id="exampleModalLabel">Adicione sua despesa</h1>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body">
                      <form>
                          <div class="mb-3">
                              <label for="tipoDespesa" class="form-label">Tipo da despesa</label>
                              <input type="text" class="form-control" id="tipoDespesa" aria-describedby="emailHelp">
                          </div>
                          <div class="mb-3">
                              <label for="valorDespesa" class="form-label">Valor da despesa</label>
                              <input type="number" class="form-control" id="valorDespesa">
                              <hr>
                              <p id="resultadoGastos"></p>
                          </div>
                      </form>
                  </div>
                  <div class="modal-footer">
                      <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
                      <button type="button" class="btn btn-success" onclick="salvarGastos()">Enviar</button>
                  </div>
              </div>
          </div>
      </div>
    </div> <!--FIM DO MODAL DE ADICIONAR DESPESAS-->


    <div class="text-center" id="dinheiroRestante"></div> <!--Mostrar o dinheiro restante-->
    <div class="text-center" id="listaDespesas"></div>  <!--Mostrar as despesas-->

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
