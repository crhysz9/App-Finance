<!-- TESTE tentando saber usar o modal (pop-up) do bootstrap ⬇️-->
<button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Adicionar despesa (TESTE)
</button>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Adicione sua despesa</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="tipoDespesa" class="form-label">Tipo da despeza</label>
            <input type="text" class="form-control" id="tipoDespesa" aria-describedby="emailHelp">
            
          </div>
          <div class="mb-3">
            <label for="valorDespesa" class="form-label">Valor da despeza</label>
            <input type="number" class="form-control" id="valorDespesa">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-success">Enviar</button>
      </div>
    </div>
  </div>
</div>
